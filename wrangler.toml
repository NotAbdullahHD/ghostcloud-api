# GhostCloud API — Cloudflare Workers
# Deploy:  npx wrangler deploy      (from this folder)
# Local:   npx wrangler dev --local  (http://localhost:8787)
#
# The whole API runs inside ONE Durable Object ("Hub"): it holds the account
# pool, sessions, presence and the WebSocket relays, and uses alarms instead of
# setInterval. That is what makes Pages-style free hosting unusable for this
# app but Workers fine: the DO is the always-on process.

name = "ghostcloud-api"
main = "src/worker.js"
compatibility_date = "2026-09-17"
# Node timers (setTimeout) and friends. Enabled by default at this compat date,
# but stated explicitly so changing the date can't silently break the app.
compatibility_flags = ["nodejs_compat"]

# The Durable Object namespace. `new_sqlite_classes` is REQUIRED on the free
# plan — without it deploy fails with:
#   "In order to use Durable Objects with a free plan, you must create a
#    namespace using a `new_sqlite_classes` migration."
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[vars]
# Pre-warmed accounts kept ready (3-20). A pooled account is an instant start;
# nobody past the end of the pool gets one, and those players are the ones that
# hammer the free mail providers into HTTP 429.
#
# Back up from 3: the daily Durable Object burn is set by the *alarm floor*
# (POOL_FILL_MIN_DELAY_MS = 20s), not by the target size — a full pool costs
# nothing at idle, and a draining one is capped at one fill attempt per 20s.
# Queue pressure, on the other hand, scales directly with how small this is.
#
# 6 → 10 (2026-10-20): Raccoon's human check is rate-limited per *egress IP*,
# and this Worker is that IP for every player. When the budget is spent for an
# hour (seen live: "Too many puzzle attempts. Please try again in 3406
# seconds.") no new account can be made, so the only thing standing between a
# player and a game is the pool. A wider buffer is the difference between
# "a few people wait" and "nobody plays until the hour rolls over".
GHOSTCLOUD_POOL_TARGET = "10"
# Reuse a finished session's account for the next player instead of registering a
# brand-new one for every session (which is what got Raccoon's registration
# endpoint gated behind a bot check). Set to "off" to go back to one account per
# session. Fresh accounts are used first; the least-used one after that.
GHOSTCLOUD_REUSE_ACCOUNTS = "on"
# Comma-separated mail.tm-shaped fallback providers (optional).
GHOSTCLOUD_MAIL_PROVIDERS = "https://api.duckmail.sbs,https://api.mail.gw"
# After Raccoon's bot wall is seen, stop attempting registrations for this long
# (ms). Retrying cannot pass the wall and only spends provider quota plus the
# free plan's 100k/day Durable Object budget, so a walled hub now costs one alarm
# per cooldown instead of one every 20s. Default 600000 (10 min).
GHOSTCLOUD_WALL_COOLDOWN_MS = "600000"

# ── Secrets (set these, do NOT commit them) ─────────────────────────────────
#   npx wrangler secret put GHOSTCLOUD_PRO_CODE      # the Pro code players type
#   npx wrangler secret put GHOSTCLOUD_PRO_EPOCH     # bump to invalidate Pro tokens
#   npx wrangler secret put GHOSTCLOUD_INBOUND_KEY   # own-domain mail lane secret
#   npx wrangler secret put GHOSTCLOUD_MAIL_DOMAIN   # your domain -> enables the durable lane
#   npx wrangler secret put GHOSTCLOUD_SEED_KEY     # require x-seed-key on /cloud/v1/seedPool
#                                                   # (optional; the site's API key is public)

[observability]
enabled = true
